name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - name: Set up Python
        run: uv python install ${{ matrix.python }}
        
      - name: Install dependencies
        run: uv sync --all-extras
        
      - name: Lint with ruff
        run: uv run ruff check --select F src/ tests/ scripts/
        
      - name: Run tests
        run: uv run pytest -q

      - name: Check portable/ is up to date
        run: |
          python3 scripts/build_portable.py
          git diff --exit-code portable/

      - name: Check plugin.json & marketplace.json
        run: |
          uv run python -m json.tool .claude-plugin/plugin.json > /dev/null
          test -f .claude-plugin/marketplace.json && uv run python -m json.tool .claude-plugin/marketplace.json > /dev/null || echo "marketplace.json missing - optional"
