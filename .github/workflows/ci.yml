name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - name: Set up Python
        run: uv python install 3.11
        
      - name: Install dependencies
        run: uv sync --all-extras
        
      - name: Lint with ruff
        run: uv run ruff check src/ tests/ || true
        
      - name: Run tests
        run: uv run pytest -q
        
      - name: Check plugin.json & marketplace.json
        run: |
          uv run python -m json.tool .claude-plugin/plugin.json > /dev/null
          test -f .claude-plugin/marketplace.json && uv run python -m json.tool .claude-plugin/marketplace.json > /dev/null || echo "marketplace.json missing - optional"
