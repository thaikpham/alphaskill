[project]
name = "sony-alpha-viet"
version = "1.0.0"
description = "Claude Code plugin + MCP server: dịch menu Sony sang tiếng Việt + hỗ trợ viết blog SEO"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "pillow", "xlrd==2.0.1", "olefile", "pyyaml"]

[project.scripts]
sony-alpha-viet-mcp = "sony_alpha_viet.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sony_alpha_viet"]

[dependency-groups]
dev = ["pytest"]
